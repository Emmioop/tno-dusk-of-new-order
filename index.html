<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="screen-orientation" content="landscape">
<meta name="x5-orientation" content="landscape">
<meta name="full-screen" content="yes">
<meta name="x5-fullscreen" content="true">
<title>钢铁秩序 · TNO · 1962 大战略</title>
<style>
:root{
  --bg:#0a0b0e;--bg2:#101218;--panel:#141820;--panel2:#1a1f2b;
  --border:#2a2f3a;--txt:#cfd4df;--dim:#808794;--gold:#c9a24a;
  --ger:#3a3a6a;--usa:#4a5a8a;--jpn:#8a3a3a;--rus:#3a6a4a;
  --itl:#6a5a3a;--bug:#1a0a2a;--spa:#5a4a3a;--pro:#5a5a8a;
  --bhm:#4a4a4a;--ukr:#3a5a6a;--saf:#6a3a5a;--int:#4a4a3a;
  --eng:#5a5a3a;--swd:#5a5a6a;--tuk:#8a4a3a;--fra:#3a4a6a;
  --sel:#f5d742;--war:#e04545;--all:#45b880;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;font-size:13px;overflow:hidden;height:100vh;user-select:none}
button{font-family:inherit;cursor:pointer;color:var(--txt);border:none;background:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:#3a4050;border-radius:4px}

/* ====== 开始界面 ====== */
#startScreen{position:fixed;inset:0;overflow:hidden;background:
  radial-gradient(ellipse at 30% 20%,#1a2030 0%,var(--bg) 60%),linear-gradient(180deg,#08090b,#0c0d10);
  display:flex;flex-direction:column;z-index:500}
#startMap{flex:1 1 300px;min-height:260px;width:100%;overflow:hidden;position:relative}
#startMap svg{width:100%;height:100%;display:block}
.start-top{padding:28px 40px 10px;text-align:center;flex-shrink:0}
.start-top h1{font-size:42px;color:var(--txt);letter-spacing:4px;text-shadow:0 0 20px rgba(201,162,74,.4);font-weight:800}
.start-top .sub{color:var(--gold);letter-spacing:8px;margin-top:6px;font-size:14px}
.start-bottom{padding:14px 40px 28px;background:linear-gradient(180deg,transparent,var(--bg));flex:0 1 auto;overflow-y:auto;max-height:45vh}
.country-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;max-width:1400px;margin:0 auto}
.country-card{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:10px;cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:8px}
.country-card:hover{border-color:var(--gold);transform:translateY(-2px);background:var(--panel2)}
.country-card.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:var(--panel2)}
.country-card .cf{width:24px;height:16px;flex-shrink:0;border-radius:2px}
.country-card .cn{font-weight:600;font-size:13px}
.country-card .ci{font-size:10px;color:var(--dim)}
.diff-row{display:flex;gap:8px;margin-bottom:14px;justify-content:center;flex-wrap:wrap}
.diff-btn{background:var(--panel);border:1px solid var(--border);padding:8px 18px;border-radius:4px;font-size:13px}
.diff-btn.sel{border-color:var(--gold);background:var(--panel2)}
.go-btn{display:block;margin:16px auto 0;background:linear-gradient(180deg,#d94b4b,#a12d2d);color:#fff;padding:14px 60px;border-radius:6px;font-size:18px;font-weight:800;letter-spacing:6px;box-shadow:0 0 24px rgba(200,60,60,.3)}
.go-btn:hover{filter:brightness(1.15)}
.disc{text-align:center;color:var(--dim);font-size:11px;margin-top:14px;line-height:1.8}

/* ====== 游戏主界面 ====== */
#gameScreen{display:none;flex-direction:column;height:100vh}
/* 顶栏资源 */
.topbar{background:linear-gradient(180deg,#0a0b0e,#12151c);border-bottom:1px solid var(--border);padding:6px 12px;display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap}
.topbar .cflag{width:22px;height:14px;border-radius:2px}
.topbar .cname{font-weight:700;color:var(--txt);font-size:14px;margin-right:10px}
.res{display:flex;flex-direction:column;align-items:center;min-width:60px;padding:2px 4px}
.res .rl{font-size:10px;color:var(--dim)}
.res .rv{font-size:14px;font-weight:700}
.res .rc{font-size:9px}
.res .rc.up{color:var(--all)}.res .rc.dn{color:var(--war)}
.sep{color:var(--border);margin:0 2px}
.right-util{margin-left:auto;display:flex;gap:6px}

/* 主体 */
.main{flex:1;display:flex;overflow:hidden;min-height:0}
/* 左侧边栏 */
.leftbar{width:220px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.lb-group{border-bottom:1px solid var(--border)}
.lb-title{padding:6px 10px;font-size:11px;color:var(--dim);letter-spacing:2px;background:var(--panel2)}
.lb-btn{padding:9px 12px;font-size:13px;text-align:left;width:100%;display:flex;align-items:center;gap:8px;transition:background .1s}
.lb-btn:hover{background:var(--panel2)}
.lb-btn.sel{background:var(--panel2);border-left:3px solid var(--gold);padding-left:9px}
.lb-btn .lbi{font-size:16px;width:20px;text-align:center}

/* 中央地图区 */
.map-area{flex:1;position:relative;overflow:hidden;background:#0c0e12;display:flex;flex-direction:column;min-width:0}
#mapSvg{flex:1;width:100%;height:100%;cursor:grab}
#mapSvg:active{cursor:grabbing}
#mapSvg svg{width:100%;height:100%;display:block}
.prov{fill:#252a35;stroke:#14161b;stroke-width:0.3;cursor:pointer;transition:fill .1s}
.prov:hover{fill:#3a4050}
.prov.sel{stroke:var(--sel);stroke-width:1.5;filter:brightness(1.25)}
.prov.sr{opacity:.4}
.prov.trg{animation:pulse 1s infinite}
.army-marker{cursor:pointer}
@keyframes pulse{0%,100%{stroke:var(--sel);stroke-width:1.5;stroke-opacity:1}50%{stroke-width:2.5;stroke-opacity:.6}}
/* 顶部国家列表 */
.country-strip{position:absolute;top:0;left:0;right:0;display:flex;gap:3px;padding:4px 8px;background:rgba(10,12,16,.85);border-bottom:1px solid var(--border);overflow-x:auto;z-index:5}
.cs-chip{display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:3px;font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.cs-chip.war{background:rgba(200,40,40,.25);border:1px solid var(--war)}
.cs-chip.all{background:rgba(50,150,100,.25);border:1px solid var(--all)}
.cs-chip:hover{filter:brightness(1.2)}
.cs-chip .cc{width:14px;height:9px;border-radius:1px}

/* 右侧信息面板 */
.rightbar{width:260px;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;flex-shrink:0}
.rb-title{padding:10px 12px;background:var(--panel2);font-weight:700;color:var(--gold);letter-spacing:1px;font-size:12px;border-bottom:1px solid var(--border)}
.rb-body{padding:10px 12px;font-size:12px;line-height:1.7}
.row{display:flex;justify-content:space-between;padding:2px 0}
.row b{color:var(--txt)}
.mini-bar{height:4px;background:var(--border);border-radius:2px;margin:3px 0 8px;overflow:hidden}
.mini-bar>div{height:100%;background:var(--gold)}
.divider{height:1px;background:var(--border);margin:10px 0}
.sml-btn{background:var(--panel2);border:1px solid var(--border);padding:5px 10px;border-radius:3px;font-size:11px;display:inline-block;margin:2px 2px 2px 0}
.sml-btn:hover{border-color:var(--gold)}
.sml-btn.danger{background:var(--war);border-color:var(--war);color:#fff}
.sml-btn.danger:hover{filter:brightness(1.1)}
.sml-btn.primary{background:var(--gold);border-color:var(--gold);color:#111}
.sml-btn.primary:hover{filter:brightness(1.1)}
.sml-btn:disabled{opacity:.4;cursor:not-allowed}
.army-row{padding:5px 6px;background:var(--panel2);border-radius:3px;margin-bottom:4px;font-size:11px;cursor:pointer;border:1px solid transparent}
.army-row:hover{border-color:var(--gold)}
.army-row.sel{border-color:var(--sel)}
.army-row .ar-top{display:flex;justify-content:space-between;font-weight:600}
.army-row .ar-bot{display:flex;justify-content:space-between;color:var(--dim);margin-top:2px}
.ar-str{color:var(--all)}
.ar-str.low{color:var(--war)}

/* 左侧内容面板（生产/科技/国策/外交） */
.sub-panel{position:absolute;left:220px;top:0;bottom:0;width:360px;background:var(--panel);border-right:1px solid var(--border);z-index:10;display:none;flex-direction:column}
.sp-head{padding:10px 12px;background:var(--panel2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sp-head h3{font-size:14px;color:var(--gold);letter-spacing:1px;flex:1}
.sp-head .close{color:var(--dim);font-size:18px;padding:0 4px}
.sp-head .close:hover{color:var(--txt)}
.sp-body{flex:1;overflow-y:auto;padding:10px}
/* 生产项 */
.prod-item{background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:10px;margin-bottom:8px}
.prod-item .pt{font-weight:700;margin-bottom:3px}
.prod-item .pd{font-size:11px;color:var(--dim);margin-bottom:6px}
.prod-item .pa{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.pbar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px}
.pbar>div{height:100%;background:linear-gradient(90deg,var(--all),var(--gold));transition:width .3s}
/* 科技树 */
.tech-tree{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tech-node{background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:8px;font-size:11px;cursor:pointer;transition:all .1s}
.tech-node:hover{border-color:var(--gold)}
.tech-node.done{border-color:var(--all);opacity:.7}
.tech-node.locked{opacity:.45;cursor:not-allowed}
.tech-node.res{border-color:var(--gold);box-shadow:0 0 8px rgba(201,162,74,.5) inset}
.tech-node .tn{font-weight:700;margin-bottom:2px;font-size:12px}
.tech-node .td{color:var(--dim);font-size:10px;line-height:1.5}
/* 国策 */
.focus-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}
.focus-node{background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:6px 4px;font-size:10px;cursor:pointer;min-height:56px;display:flex;align-items:center;justify-content:center;text-align:center;transition:all .1s}
.focus-node:hover{border-color:var(--gold)}
.focus-node.done{border-color:var(--all);background:rgba(60,150,100,.15)}
.focus-node.act{border-color:var(--gold);box-shadow:0 0 8px rgba(201,162,74,.5) inset}
.focus-node.locked{opacity:.4;cursor:not-allowed}
.focus-ct{position:relative;width:100%}
.focus-ct .fp{height:3px;background:var(--border);margin-top:3px;overflow:hidden;border-radius:2px}
.focus-ct .fp>div{height:100%;background:var(--gold)}

/* ====== 底栏时间控制 ====== */
.bottombar{background:linear-gradient(180deg,#12151c,#0a0b0e);border-top:1px solid var(--border);padding:6px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap}
.time-btns{display:flex;gap:2px}
.tb{background:var(--panel2);border:1px solid var(--border);padding:5px 10px;font-size:12px;border-radius:3px}
.tb:hover{border-color:var(--gold)}
.tb.sel{background:var(--gold);color:#111;border-color:var(--gold)}
.tb.pause{color:var(--war);font-weight:700}
.tb.pause.sel{background:var(--war);color:#fff;border-color:var(--war)}
.date-info{font-size:15px;font-weight:700;color:var(--gold);min-width:150px;text-align:center;letter-spacing:1px}
.speed-btns{display:flex;gap:2px;margin-left:auto}
.spd{background:var(--panel2);border:1px solid var(--border);padding:4px 8px;font-size:12px;border-radius:3px;min-width:30px;font-weight:700}
.spd:hover{border-color:var(--gold)}
.spd.sel{background:var(--gold);color:#111;border-color:var(--gold)}

/* ====== 弹窗（事件/外交/宣战等） ====== */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:900;padding:20px}
.m-box{background:var(--panel);border:1px solid var(--gold);border-radius:6px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 0 60px rgba(201,162,74,.2)}
.m-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.m-head .mc{width:22px;height:14px;border-radius:2px;flex-shrink:0}
.m-head h2{font-size:17px;flex:1}
.m-head .cl{color:var(--dim);font-size:18px;cursor:pointer}
.m-head .cl:hover{color:var(--txt)}
.m-body{padding:16px 18px;line-height:1.8;font-size:13px}
.m-choices{padding:10px 18px 16px;display:flex;flex-direction:column;gap:6px}
.mc-btn{background:var(--panel2);border:1px solid var(--border);padding:10px 12px;border-radius:4px;text-align:left;font-size:13px;transition:all .1s}
.mc-btn:hover{border-color:var(--gold);background:#242a38}
.mc-btn .mt{font-weight:600;margin-bottom:3px}
.mc-btn .me{font-size:11px;color:var(--dim);line-height:1.5}

/* 结束界面 */
#endScreen{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:999;padding:30px;overflow-y:auto}
.end-box{max-width:700px;text-align:center}
.end-box h1{font-size:44px;margin-bottom:14px;letter-spacing:4px;font-weight:800}
.end-box .ey{color:var(--gold);letter-spacing:6px;margin-bottom:10px;font-size:13px}
.end-box p{color:#b8bdc8;line-height:2;margin-bottom:24px}
.end-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:24px}
.es{background:var(--panel);padding:10px;border-radius:4px;border:1px solid var(--border)}
.es .esl{font-size:10px;color:var(--dim)}
.es .esv{font-size:18px;color:var(--gold);font-weight:700}

/* ====== 平板适配 ====== */
@media(max-width:1100px){
  .leftbar{width:50px}
  .lb-btn span,.lb-title{display:none}
  .sub-panel{left:50px;width:320px}
  .country-card .ci{display:none}
}
@media(max-width:760px){
  .rightbar{width:200px}
  .topbar .res{min-width:46px}
  .res .rv{font-size:12px}
}

/* ====== 手机端适配 ====== */
@media(max-width:640px){
  /* 开始界面 */
  #startScreen{overflow-y:auto;-webkit-overflow-scrolling:touch}
  .start-top{padding:16px 16px 6px}
  .start-top h1{font-size:26px;letter-spacing:2px}
  .start-top .sub{letter-spacing:3px;font-size:11px}
  #startMap{height:200px;flex-shrink:0;min-height:120px}
  .start-bottom{padding:10px 12px 20px}
  .country-grid{grid-template-columns:1fr 1fr;gap:6px}
  .country-card{padding:8px}
  .country-card .cn{font-size:12px}
  .country-card .ci{display:none}
  .diff-row{gap:4px}
  .diff-btn{padding:6px 10px;font-size:11px}
  .go-btn{padding:12px 40px;font-size:15px;letter-spacing:3px}
  .disc{font-size:10px}

  /* 游戏主界面：改为单列布局 */
  #gameScreen{height:100vh;height:100dvh}
  .topbar{padding:4px 8px;gap:4px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  .topbar .cname{font-size:11px;margin-right:4px;white-space:nowrap}
  .topbar .cflag{width:18px;height:11px}
  .res{min-width:42px;padding:1px 2px}
  .res .rl{font-size:9px}
  .res .rv{font-size:12px}
  .res .rc{font-size:8px}
  .sep{display:none}
  .right-util{margin-left:auto}
  .right-util .sml-btn{padding:4px 8px;font-size:10px}

  /* 隐藏左侧栏，用底部导航替代 */
  .leftbar{display:none!important}
  .main{flex-direction:column}

  /* 地图区占满 */
  .map-area{flex:1;min-height:0}
  .country-strip{padding:3px 6px}
  .cs-chip{padding:2px 6px;font-size:10px}
  .cs-chip .cc{width:12px;height:8px}

  /* 右侧面板变为底部弹出的覆盖层 */
  .rightbar{
    position:fixed;bottom:0;left:0;right:0;
    width:100%;max-height:45vh;
    border-left:none;border-top:1px solid var(--gold);
    z-index:50;transform:translateY(100%);
    transition:transform .25s ease;border-radius:12px 12px 0 0;
  }
  .rightbar.show{transform:translateY(0)}
  .rb-title{font-size:13px;padding:8px 12px;cursor:pointer}
  .rb-body{padding:8px 12px;font-size:12px;max-height:35vh;overflow-y:auto}
  .army-row{padding:8px;font-size:12px}

  /* 子面板全屏覆盖 */
  .sub-panel{
    position:fixed;left:0!important;top:0!important;bottom:0!important;
    width:100%!important;max-width:100%;z-index:60;
    border-radius:0;border-right:none;
  }
  .sp-head{padding:10px 14px}
  .sp-head h3{font-size:15px}
  .sp-head .close{font-size:24px;padding:0 8px}
  .sp-body{padding:10px 12px}
  .tech-tree{grid-template-columns:1fr 1fr}
  .focus-row{grid-template-columns:1fr 1fr 1fr;gap:4px}
  .focus-node{min-height:48px;font-size:9px}
  .prod-item{padding:8px}

  /* 底栏时间控制 */
  .bottombar{padding:4px 8px;gap:6px;flex-wrap:nowrap}
  .tb{padding:6px 12px;font-size:13px}
  .date-info{font-size:12px;min-width:110px;letter-spacing:0}
  .spd{padding:6px 10px;min-width:36px;font-size:13px}

  /* 底部导航栏 */
  .mobile-nav{
    display:flex!important;
    position:fixed;bottom:0;left:0;right:0;
    background:linear-gradient(180deg,#12151c,#0a0b0e);
    border-top:1px solid var(--border);
    z-index:40;padding:2px;gap:2px;
    justify-content:space-around;
  }
  .mobile-nav .mn-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;
    padding:4px 2px;font-size:9px;color:var(--dim);
    gap:1px;border-radius:3px;
  }
  .mobile-nav .mn-btn .mni{font-size:18px}
  .mobile-nav .mn-btn.sel{color:var(--gold)}
  .mobile-nav .mn-btn:active{background:var(--panel2)}

  /* 弹窗适配 */
  .modal{padding:10px}
  .m-box{max-width:100%}
  .m-head h2{font-size:15px}
  .m-body{padding:12px 14px;font-size:13px}
  .mc-btn{padding:12px;font-size:13px}
  .end-box h1{font-size:30px;letter-spacing:2px}
  .end-stats{grid-template-columns:repeat(3,1fr)}
  .es .esv{font-size:14px}

  /* 地图省份交互：增大点击区域 */
  .prov{stroke-width:0.5}
  .army-marker rect{width:12px;height:12px;rx:2}
}

/* 手机端才显示的元素 */
.mobile-nav{display:none}
.mobile-toggle{display:none}
@media(max-width:640px){
  .mobile-toggle{display:flex;align-items:center;justify-content:center}
}

/* 触摸优化 */
@media(hover:none) and (pointer:coarse){
  .prov:hover{fill:#252a35}
  .country-card:hover{transform:none}
  .lb-btn:hover{background:transparent}
  .cs-chip:hover{filter:none}
  .tech-node:hover{border-color:var(--border)}
  .focus-node:hover{border-color:var(--border)}
  .mc-btn:hover{border-color:var(--border);background:var(--panel2)}
}

/* ====== 40个国家颜色变量（供SVG地图使用） ====== */
:root{
  --cc-ger:#3a3a6a; --cc-usa:#4a5a8a; --cc-jpn:#8a3a3a; --cc-wrrf:#3a6a4a;
  --cc-rsi:#6a5a3a; --cc-bug:#1a0a2a; --cc-ibe:#5a4a3a; --cc-fra:#3a4a6a;
  --cc-pro:#5a5a8a; --cc-eng:#5a5a3a; --cc-sca:#5a5a6a; --cc-tur:#8a4a3a;
  --cc-saf:#6a3a5a; --cc-can:#4a4a6a; --cc-arg:#6a4a4a; --cc-aus:#4a5a5a;
  --cc-ukr:#3a5a6a; --cc-warl:#4a4a3a; --cc-paf:#4a6a5a; --cc-kom:#3a5a5a;
  --cc-hun:#5a3a4a; --cc-rom:#5a4a4a; --cc-bul:#5a5a3a; --cc-gre:#3a5a5a;
  --cc-ser:#4a3a4a; --cc-slk:#4a4a5a; --cc-cro:#5a3a5a; --cc-mne:#3a3a5a;

// ====== 通用工具函数 ======
function shade(hex, percent){
  try{
    if(!hex) return percent<0 ? '#333333' : '#ffffff';
    hex = String(hex).trim();
    let r=0,g=0,b=0;
    if(hex.startsWith('#')){
      const h = hex.slice(1);
      if(h.length===3){
        r = parseInt(h[0]+h[0],16);
        g = parseInt(h[1]+h[1],16);
        b = parseInt(h[2]+h[2],16);
      }else if(h.length>=6){
        r = parseInt(h.slice(0,2),16);
        g = parseInt(h.slice(2,4),16);
        b = parseInt(h.slice(4,6),16);
      }
    }else if(hex.startsWith('rgb')){
      const m = hex.match(/\d+/g);
      if(m && m.length>=3){ r=+m[0]; g=+m[1]; b=+m[2]; }
    }else{
      return hex;
    }
    const p = Math.max(-100, Math.min(100, +percent||0));
    const f = (x)=>{
      const v = p<0 ? x*(100+p)/100 : x + (255-x)*(p/100);
      return Math.max(0, Math.min(255, Math.round(v)));
    };
    r=f(r); g=f(g); b=f(b);
    const toHex = (v)=> (v<16?'0':'') + v.toString(16);
    return '#'+toHex(r)+toHex(g)+toHex(b);
  }catch(e){ return hex; }
}

// ====== 启动游戏 ======
function startGame(){
  if(!SEL_COUNTRY) return alert('请选择一个国家');
  // 初始化国家状态
  G={ countries: COUNTRIES, playerCC:SEL_COUNTRY, me:SEL_COUNTRY,
    diff:DIFF,
    diffMul:{recruit:1.4,normal:1,veteran:0.75,elite:0.55}[DIFF]||1,
    day:0, // 从1962-01-01起算
    speed:0, // 0暂停,1..5
    startYear:1962,startMonth:1,startDay:1,
    // 省份所有者实时映射
    provMap:{},
    // 国家状态
    cs:{},
    // 军队
    armies:[],
    armyIdx:1,
    // 选中
    selProv:null,selArmy:null,provArmies:{},
    // 外交关系
    rel:{},
    // UI
    showPanel:'none',
    triggered:[],
    gameOver:false,
    ccWars:{} // { 'cc1-cc2': true }
  };
  // 初始化省份
  for(const p of Object.values(PROVINCES)){G.provMap[p.id]={id:p.id,cc:p.cc,ic:Math.floor(Math.random()*5)+1};}
  // 初始化每个国家
  for(const cc in COUNTRIES){G.cs[cc]=startOf(cc);}
  // Auto-assign each country's capital = first province in PROVINCES whose cc matches (or COUNTRIES[cc].cap if still valid
  for(const cc in COUNTRIES){
    const C = COUNTRIES[cc];
    const capAlready = C.cap && PROVINCES[C.cap] && PROVINCES[C.cap].cc===cc;
    if(!capAlready){
      const first = Object.values(PROVINCES).find(p=>p.cc===cc);
      if(first) C.cap = first.id;
    }
    // Also set G.countries alias
    if(G.countries && !G.countries[cc]) G.countries[cc] = C;
  }
  // 处理傀儡/宣称/阵营
  for(const cc in G.cs){
    const c=G.cs[cc];
    if(COUNTRIES[cc].puppet) c.puppetOf=COUNTRIES[cc].puppet;
    if(COUNTRIES[cc].faction) c.faction=COUNTRIES[cc].faction;
    if(COUNTRIES[cc].riv){c.riv=[...COUNTRIES[cc].riv];COUNTRIES[cc].riv.forEach(r=>{if(G.cs[r]){G.cs[r].riv=G.cs[r].riv||[];if(!G.cs[r].riv.includes(cc))G.cs[r].riv.push(cc);}});}
  }
  // 初始化关系
  for(const a in G.cs){
    G.rel[a]={};
    for(const b in G.cs){
      if(a===b){G.rel[a][b]=100;continue;}
      const ca=G.cs[a],cb=G.cs[b];
      let v=0;
      if(ca.faction&&cb.faction&&ca.faction===cb.faction)v=70;
      else if(ca.riv&&ca.riv.includes(b)||cb.riv&&cb.riv.includes(a))v=-80;
      else if(ca.puppetOf===b||cb.puppetOf===a)v=90;
      else v=-20+Math.floor(Math.random()*30);
      G.rel[a][b]=v;
    }
  }
  // 初始军队：给每个国家一些师
  const initArmies=[];
  for(const cc in G.cs){
    const c=G.cs[cc];
    // 找到首都省份
    const cap = COUNTRIES[cc].cap || Object.values(PROVINCES).find(p=>p.cc===cc)?.id;
    if(!cap) continue;
    const n={
      ger:14,usa:12,jpn:10,rus:6,itl:6,bug:4,spa:5,fra:5,eng:3,pro:3,swd:3,
      tuk:5,can:4,saf:3,bhm:2,arg:3,aus:4,ukr:3,
    }[cc]||3;
    for(let i=0;i<n;i++){
      initArmies.push(mkArmy(cc,cap,`${c.flag}第${i+1}集团军`,
        40+Math.floor(Math.random()*40),
        60+Math.floor(Math.random()*30),
        20+Math.floor(Math.random()*15)));
    }
    c.armySize=n;
  }
  G.armies=initArmies;
  recalcProvArmies();

  // 显示界面
  $('startScreen').style.display='none';
  $('gameScreen').style.display='flex';
  renderAll();
  startTicker();
}
function mkArmy(cc,prov,name,divs,str,speed){
  return {
    id:G.armyIdx++,cc,prov,name,
    divisions:divs,strength:str,
    speed: speed||22,
    morale:0.8+Math.random()*0.2,
    moving:null, // {target, daysLeft, from}
    fighting:null,
  };
}

// ====== 主循环 Ticker ======
function startTicker(){
  if(tick) clearInterval(tick);
  tick=setInterval(()=>{
    if(G.gameOver||G.speed===0) return;
    // 一个 tick 推进 speed 天（最快1倍=1天/帧；更快速度=每帧多天
    for(let i=0;i<G.speed;i++) advanceDay();
  },120);
}
function setSpeed(s){
  G.speed=s;
  // UI更新
  for(let i=0;i<=5;i++){
    const b=$(`spd_${i}`);if(!b)continue;
    b.classList.toggle('sel',i===s);
    if(i===0)$('pauseBtn')?.classList.toggle('sel',s===0);
  }
  renderDate();
}

function advanceDay(){
  G.day++;
  // 日期
  const d=new Date(1962,0,1);d.setDate(d.getDate()+G.day);
  const cs=G.cs;
  const cur=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
  for(const cc in cs){
    const c=cs[cc];
    c.year=d.getFullYear();c.month=d.getMonth()+1;c.day=d.getDate();
    // 资源更新
    const daily = dailyIncome(cc);
    c.manpower+=daily.mp*G.diffMul/365;
    c.arms+=daily.arms/30;
    c.oil+=daily.oil/30;
    c.steel+=daily.steel/30;
    c.pp+=daily.pp/30;
    if(d.getDate()===1){
      // 每月
      c.stab=clamp(c.stab+(c.stab<70?0.15:-0.05),-100,100);
      c.armies && Object.keys(c.armies||{}).length;
      // 装备更新
      for(const k in c.equips){c.equips[k]+=daily[k]||0;}
    }
    // 研发进度
    if(c.researching){
      const t=TECHS.find(x=>x.id===c.researching);
      if(t){
        const bonus=1+(c.techBonus||0)+(cc===G.me?0:0);
        c.researchProgress += bonus;
        if(c.researchProgress>=t.time){
          c.techs.push(t.id);
          if(t.id==='ind1')c.civEff+=0.1;
          if(t.id==='ind2')c.civEff+=0.15;
          if(t.id==='air1')c.air=c.air*1.3|0;
          if(t.id==='air2')c.air=c.air*1.4|0;
          if(t.id==='arm1'){c.equips.arm*=1.25|0;}
          c.researching=null;c.researchProgress=0;
        }
      }
    }
    // 国策
    if(c.focus){
      const f=getFocus(cc,c.focus);
      if(f){
        c.focusProgress++;
        if(c.focusProgress>=f.time){
          c.focusDone.push(c.focus);
          f.eff(c);
          c.focus=null;c.focusProgress=0;
          if(cc===G.me)showModal(cc,`国策完成：${f.name}`,f.desc,[{t:'继续',e:()=>{}}]);
        }
      }
    }
    // 胜利条件检查（仅玩家国家
    if(cc===G.me){
      // 1. 控制足够多省份
      const myProv=Object.values(PROVINCES).filter(p=>G.provMap[p.id].cc===G.me).length;
      if(myProv>35 && d.getFullYear()<2000){
        endGame('victory',`掌控 ${myProv} 个省份，新秩序由你决定。`);
      }
      // 2. 稳定<=-90
      if(c.stab<=-90){endGame('collapse','国家崩溃。');}
    }
  }
  // 军队推进
  tickArmies();
  // 事件检测
  checkEvents();
  renderUI();
}
function dailyIncome(cc){
  const c=G.cs[cc];
  const provs=Object.values(PROVINCES).filter(p=>G.provMap[p.id].cc===cc);
  const ic=provs.reduce((s,p)=>s+G.provMap[p.id].ic,0);
  return {
    mp: provs.length*20+c.manpower*0.005,
    arms: (c.mil+c.arms||0)*0.5,
    oil: (c.oil||0)*0.1+provs.length*0.3,
    steel:(c.steel||0)*0.1+ic*0.3,
    pp: 10+c.pp*0.02,
  };
}
function getFocus(cc,fid){
  const list=FOCUSES[cc]||GENERIC_FOCUS;
  return list.find(f=>f.id===fid)||GENERIC_FOCUS.find(f=>f.id===fid);
}

// ====== 军队推进（战斗/移动）======
function tickArmies(){
  const toRemove=[];
  G.ccWars = {...G.ccWars};
  for(const a of G.armies){
    if(a.divisions<=0){toRemove.push(a.id);continue;}
    // 移动
    if(a.moving){
      a.moving.daysLeft--;
      if(a.moving.daysLeft<=0){
        const target=a.moving.target;
        const map=G.provMap[target];
        if(!map){a.moving=null;continue;}
        // 如果目标省份是敌对
        const owner = map.cc;
        if(owner!==a.cc && isAtWar(a.cc,owner)){
          // 发生战斗
          const defArmies = provArmiesOf(owner,target);
          const totalAtk = a.divisions*(a.strength/100)*a.morale;
          const totalDef = defArmies.reduce((s,d)=>s+d.divisions*(d.strength/100)*d.morale,0)
            + G.provMap[target].ic*8;
          // 结果判定
          if(totalAtk>totalDef*1.05){
            // 攻方胜
            const losses = Math.ceil(a.divisions*(0.15+Math.random()*0.1));
            a.divisions = Math.max(1,a.divisions-losses);
            a.strength = clamp(a.strength-8,10,100);
            // 移走防御方
            const defLoss = Math.ceil(totalDef*0.3);
            defArmies.forEach(d=>{
              const l=Math.ceil(d.divisions*0.6);
              d.divisions=Math.max(1,d.divisions-l);
              d.prov=adjacentProvinceOf(owner,target)||d.prov;
              d.strength=clamp(d.strength-15,10,100);
            });
            // 占领
            map.cc=a.cc;
            a.prov=target;
            if(a.cc===G.me || owner===G.me) newsFlash(`${cflag(a.cc)} ${cname(a.cc)} 占领 ${PROVINCES[target]?.name}`);
          } else {
            // 守方胜
            const losses=Math.ceil(a.divisions*0.25);
            a.divisions=Math.max(1,a.divisions-losses);
            a.strength=clamp(a.strength-15,10,100);
            a.prov=a.moving.from;
          }
        } else if(owner===a.cc || isFriendly(a.cc,owner)){
          // 行军抵达
          a.prov=target;
        } else {
          // 敌对但未宣战 -> 自动宣战？仅玩家主动宣战才打
          a.prov=a.moving.from;
          if(a.cc===G.me){newsFlash(`${cname(owner)}的领土：请先宣战`);}
        }
        a.moving=null;
        recalcProvArmies();
      }
    }
    // 所在省有敌方军队 -> 自动战斗
    if(!a.moving){
      const enemies=G.armies.filter(b=>b.prov===a.prov && b.cc!==a.cc && isAtWar(a.cc,b.cc));
      if(enemies.length){
        const totalAtk=a.divisions*(a.strength/100)*a.morale;
        let totalDef=0;enemies.forEach(e=>totalDef+=e.divisions*(e.strength/100)*e.morale);
        if(totalAtk>totalDef*1.03){
          enemies.forEach(e=>{
            const l=Math.ceil(e.divisions*0.18);
            e.divisions=Math.max(0,e.divisions-l);
            e.strength=clamp(e.strength-12,10,100);
            // 推回相邻省份
            if(e.divisions<=0){toRemove.push(e.id);return;}
            const nxt=adjacentProvinceOf(e.cc,e.prov);
            if(nxt)e.prov=nxt;
          });
          const l=Math.ceil(a.divisions*0.08);
          a.divisions=Math.max(1,a.divisions-l);
          a.strength=clamp(a.strength-6,20,100);
        } else {
          const l=Math.ceil(a.divisions*0.18);
          a.divisions=Math.max(0,a.divisions-l);
          a.strength=clamp(a.strength-12,10,100);
          if(a.divisions<=0)toRemove.push(a.id);
          else{
            const nxt=adjacentProvinceOf(a.cc,a.prov);
            if(nxt)a.prov=nxt;
          }
        }
      }
    }
  }
  G.armies=G.armies.filter(a=>!toRemove.includes(a.id));
}
function recalcProvArmies(){
  G.provArmies={};
  for(const a of G.armies){
    if(!G.provArmies[a.prov])G.provArmies[a.prov]=[];
    G.provArmies[a.prov].push(a);
  }
}
function provArmiesOf(cc,prov){return (G.provArmies[prov]||[]).filter(a=>a.cc===cc);}
function isAtWar(a,b){
  if(a===b)return false;
  const ca=G.cs[a],cb=G.cs[b];
  if(!ca||!cb)return false;
  if(ca.atWar&&cb.atWar&&(ca.atWar[b]||cb.atWar[a]))return true;
  if(ca.puppetOf&&isAtWar(ca.puppetOf,b))return true;
  if(cb.puppetOf&&isAtWar(a,cb.puppetOf))return true;
  if(ca.faction&&cb.faction&&ca.faction!==cb.faction){
    const fa=FACTIONS[ca.faction];const fb=FACTIONS[cb.faction];
    if(fa&&fb&&isAtWar(fa.leader,fb.leader))return true;
  }
  return false;
}
function isFriendly(a,b){
  if(a===b)return true;
  if(!G.cs[a]||!G.cs[b])return false;
  const ca=G.cs[a],cb=G.cs[b];
  if(ca.puppetOf===b||cb.puppetOf===a)return true;
  if(ca.faction&&ca.faction===cb.faction)return true;
  return (G.rel[a]?.[b]||0)>50;
}
function adjacentProvinceOf(cc,pid){
  // 找距离最近的同cc且非pid的省份（模拟"相邻省份"）
  const me = PROVINCES[pid]; if(!me) return null;
  let best=null,bestD=1e9;
  for(const p of Object.values(PROVINCES)){
    if(p.id===pid) continue;
    if(G.provMap[p.id].cc!==cc) continue;
    const d=Math.hypot(p.cx-me.cx,p.cy-me.cy);
    if(d<bestD){bestD=d;best=p;}
  }
  if(best && bestD<200) return best.id;
  // fallback: 最近非战争省份
  for(const p of Object.values(PROVINCES)){
    if(p.id===pid) continue;
    const d=Math.hypot(p.cx-me.cx,p.cy-me.cy);
    if(d<bestD){bestD=d;best=p;}
  }
  return best?best.id:null;
}

// ====== 事件 ======
function checkEvents(){
  for(const ev of EVENTS){
    if(G.triggered.includes(ev.id))continue;
    // 仅玩家国家事件
    const p=G.cs[G.me];
    if(ev.trig(p)){
      G.triggered.push(ev.id);
      showModal(G.me,ev.title,ev.body,ev.choices.map(c=>({t:t=>t,e:c.e})));
    }
  }
}

// ====== 渲染 ======
function renderAll(){renderUI();renderMap();}
function renderUI(){renderTopbar();renderBottombar();renderRightbar();renderLeftbar();}

function renderTopbar(){
  const c=G.cs[G.me];
  const inc=dailyIncome(G.me);
  const mp=dailyIncome(G.me);
  const res=[
    ['🏛','政治点',c.pp|0,mp.pp|0],
    ['⚖','稳定',c.stab|0,0],
    ['❤','战争支持',c.warSupport|0,0],
    ['👥','人力',c.manpower|0,mp.mp|0],
    ['🏭','民工厂',c.civ|0,0],
    ['⚙','军工厂',c.mil|0,0],
    ['⚔','陆军师',c.armySize|0,0],
    ['🛩','空军',c.air|0,0],
    ['☢','核弹',c.nukes|0,0],
    ['💥','装备',c.equips.inf|0,mp.arms|0],
  ];
  $('topbar').innerHTML=`
    <div class="cflag" style="background:${ccol(G.me)}"></div>
    <div class="cname">${cflag(G.me)} ${cname(G.me)}</div>
    ${res.map(r=>`<div class="res"><div class="rl">${r[0]} ${r[1]}</div><div class="rv">${fmt(r[2])}</div>
    ${r[3]?`<div class="rc ${r[3]>0?'up':'dn'}">${r[3]>0?'+':''}${fmt(r[3])}/月</div>`:''}</div>`).join('<span class="sep">│</span>')}
    <div class="right-util">
      <button class="sml-btn" onclick="switchPanel('diplomacy',null)">外交</button>
      <button class="sml-btn" onclick="if(confirm('放弃游戏？'))endGame('quit','你放弃了游戏')">菜单</button>
    </div>`;
  // 阵营条
  let strip='';
  for(const cc in G.cs){
    const o=G.cs[cc];
    const war=isAtWar(G.me,cc);const ally=isFriendly(G.me,cc)&&cc!==G.me;
    const cls=war?'war':ally?'all':'';
    strip+=`<div class="cs-chip ${cls}" onclick="showCountry('${cc}')">
      <div class="cc" style="background:${ccol(cc)}"></div>
      <span>${o.tag}</span></div>`;
  }
  $('countryStrip').innerHTML=strip;
}

function renderBottombar(){
  const d=new Date(1962,0,1);d.setDate(d.getDate()+G.day);
  $('bottombar').innerHTML=`
    <div class="time-btns">
      <button class="tb pause ${G.speed===0?'sel':''}" id="pauseBtn" onclick="setSpeed(0)">⏸ 暂停</button>
      <button class="tb" onclick="advanceDay();renderUI()">▶ 1天</button>
    </div>
    <div class="date-info" id="dateInfo">${fmtDate(d)}</div>
    <div class="speed-btns">
      <button class="spd" id="spd_1" onclick="setSpeed(1)" ${G.speed===1?'class="sel"':''}>1x</button>
      <button class="spd" id="spd_2" onclick="setSpeed(2)">2x</button>
      <button class="spd" id="spd_3" onclick="setSpeed(3)">3x</button>
      <button class="spd" id="spd_4" onclick="setSpeed(4)">4x</button>
      <button class="spd" id="spd_5" onclick="setSpeed(5)">5x</button>
    </div>
  `;
  // 高亮当前速度
  for(let i=1;i<=5;i++){
    const b=$(`spd_${i}`);if(!b)continue;
    b.className='spd'+(G.speed===i?' sel':'');
    b.onclick=()=>setSpeed(i);
  }
}
function renderDate(){renderBottombar();}
function fmtDate(d){
  const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();
  const wk=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  return `${y}年${m}月${day}日 ${wk}`;
}

function renderLeftbar(){
  // 更新左侧栏选中
  document.querySelectorAll('.lb-btn').forEach(b=>{
    const p=b.dataset.panel;
    b.classList.toggle('sel',p===G.showPanel);
  });
  // 更新底部导航选中
  document.querySelectorAll('.mn-btn').forEach(b=>{
    const txt=b.textContent.trim();
    const panelMap={'🗺':'none','🏛':'politics','🎯':'focus','⚔':'army','🏭':'production','🔬':'tech','🤝':'diplomacy'};
    const icon=b.querySelector('.mni')?.textContent;
    b.classList.toggle('sel',panelMap[icon]===G.showPanel);
  });
}

function toggleRightbar(){
  const rb=$('rightbar');
  rb.classList.toggle('show');
}
// 点击地图区域时关闭右侧面板（手机端）
function closeRightbar(){$('rightbar')?.classList.remove('show');}

function switchPanel(panel,btn){
  G.showPanel=panel;
  closeRightbar(); // 切换面板时关闭信息栏
  if(panel==='none'){$('subPanel').style.display='none';renderMap();renderLeftbar();return;}
  $('subPanel').style.display='flex';
  const titles={politics:'🏛 政治与国家',focus:'🎯 国策树',army:'⚔ 陆军与编制',production:'🏭 工业生产',tech:'🔬 科技研究',diplomacy:'🤝 外交'};
  $('spTitle').textContent=titles[panel]||'面板';
  const body=$('spBody');
  if(panel==='politics')body.innerHTML=renderPolitics();
  else if(panel==='focus')body.innerHTML=renderFocus();
  else if(panel==='army')body.innerHTML=renderArmy();
  else if(panel==='production')body.innerHTML=renderProduction();
  else if(panel==='tech')body.innerHTML=renderTech();
  else if(panel==='diplomacy')body.innerHTML=renderDiplomacy();
  renderLeftbar();
}

function consumePP(){
  const c=G.cs[G.me];if(c.pp<50)return alert('政治点不足');
  c.pp-=50;c.stab+=8;renderUI();
}

function renderFocus(){
  const c=G.cs[G.me];const list=FOCUSES[G.me]||GENERIC_FOCUS;
  const maxCol=Math.max(...list.map(f=>f.col))+1;
  // 按行构建
  const rows=[];
  for(const f of list){if(!rows[f.row])rows[f.row]=[];rows[f.row][f.col]=f;}
  let html='';
  for(const r of rows){
    html+='<div class="focus-row">';
    for(let col=0;col<maxCol;col++){
      const f=r[col];
      if(!f){html+='<div style="min-height:56px"></div>';continue;}
      const done=c.focusDone.includes(f.id);
      const act=c.focus===f.id;
      const reqOk=!f.req||f.req.every(r=>c.focusDone.includes(r));
      const locked=!reqOk&&!done;
      let cls='focus-node';if(done)cls+=' done';else if(act)cls+=' act';else if(locked)cls+=' locked';
      html+=`<div class="${cls}" onclick="${!done&&!locked?`setFocus('${f.id}')`:''}">
        <div class="focus-ct">
          <div style="font-weight:700">${f.name}</div>
          <div style="font-size:9px;color:var(--dim);margin-top:2px">${f.time}天</div>
          ${act?`<div class="fp"><div style="width:${(c.focusProgress/f.time*100).toFixed(1)}%"></div></div>`:''}
        </div></div>`;
    }
    html+='</div>';
  }
  if(c.focus){
    const f=getFocus(G.me,c.focus);
    html+=`<div class="divider"></div><div style="font-size:12px;color:var(--gold)">当前国策：<b>${f.name}</b>（${c.focusProgress}/${f.time}天）</div>
      <div style="font-size:11px;color:var(--dim);margin-top:4px">${f.desc}</div>`;
  }
  return html;
}
function setFocus(fid){
  const c=G.cs[G.me];const f=getFocus(G.me,fid);
  if(!f||c.focusDone.includes(fid))return;
  if(f.req){for(const r of f.req){if(!c.focusDone.includes(r))return;}}
  c.focus=fid;c.focusProgress=0;renderUI();
}

function renderArmy(){
  const myArmies=G.armies.filter(a=>a.cc===G.me);
  const c=G.cs[G.me];
  let html=`<div class="row"><span>陆军师总数</span><b>${myArmies.reduce((s,a)=>s+a.divisions,0)}</b></div>
    <div class="row"><span>集团军数</span><b>${myArmies.length}</b></div>
    <div class="row"><span>空军联队</span><b>${c.air}</b></div>
    <div class="row"><span>总战斗力</span><b>${fmt(myArmies.reduce((s,a)=>s+a.divisions*(a.strength/100),0))}</b></div>
    <div class="divider"></div>
    <button class="sml-btn primary" onclick="raiseArmy()">招募新兵（-50人力）</button>
    <div class="divider"></div>
    <div style="font-size:11px;color:var(--dim);margin-bottom:6px">我的部队（选中可命令移动）：</div>`;
  myArmies.forEach(a=>{
    const p=PROVINCES[a.prov];const pn=p?p.name:'未知';
    const low=a.strength<40;
    html+=`<div class="army-row ${G.selArmy===a.id?'sel':''}" onclick="selectArmy(${a.id})">
      <div class="ar-top"><span>${a.name}</span><span class="ar-str ${low?'low':''}${a.strength>70?'':''}">${fmt(a.strength)}%</span></div>
      <div class="ar-bot"><span>${pn}${a.moving?' → 移动中':''}</span><span>${a.divisions}师</span></div>
    </div>`;
  });
  if(!myArmies.length)html+='<div class="muted">暂无军队</div>';
  return html;
}
function raiseArmy(){
  const c=G.cs[G.me];if(c.manpower<50)return alert('人力不足');
  const cap=COUNTRIES[G.me].cap||Object.values(PROVINCES).find(p=>p.cc===G.me)?.id;
  c.manpower-=50;c.armySize+=1;
  const a=mkArmy(G.me,cap,`${cflag(G.me)}第${c.armySize}集团军`,12,100,25);
  G.armies.push(a);recalcProvArmies();renderUI();renderMap();
}
function selectArmy(id){
  G.selArmy=id;
  // 高亮该军所在省
  const a=G.armies.find(x=>x.id===id);
  if(a){G.selProv=a.prov;renderMap();}
  // 手机端关闭子面板回到地图
  if(window.innerWidth<=640){switchPanel('none');}
  renderUI();
  newsFlash(`选中：${a.name}，点击目标省份移动`);
}

function renderProduction(){
  const c=G.cs[G.me];
  const lines=[
    {k:'inf',name:'步兵装备',cost:2,out:30},
    {k:'arm',name:'装甲车辆',cost:5,out:8},
    {k:'air',name:'作战飞机',cost:4,out:12},
    {k:'sup',name:'补给物资',cost:1,out:50},
  ];
  const totalMil=c.mil;
  let used=0;
  for(const l of lines) used+=c.prod[l.k]?.factories||0;
  const free=Math.max(0,totalMil-used);
  let html=`<div class="row"><span>可用军工厂</span><b style="color:var(--all)">${free}</b> / ${totalMil}</div>
    <div class="row"><span>民用工厂</span><b>${c.civ}</b>（用于贸易和基建）</div>
    <div class="divider"></div>`;
  lines.forEach(l=>{
    const cur=c.prod[l.k]||{factories:0,progress:0};
    const pct=Math.min(100,cur.progress*10);
    html+=`<div class="prod-item">
      <div class="pt">${l.name} <span style="color:var(--dim);float:right;font-weight:400;font-size:11px">库存 ${fmt(c.equips[l.k])}</span></div>
      <div class="pd">每厂 ${l.out}/月 · 消耗 ${l.cost} 钢/油</div>
      <div class="pa">
        <div style="font-size:12px">
          <button class="sml-btn" onclick="adjustProd('${l.k}',-1)">－</button>
          <b style="color:var(--gold);margin:0 6px">${cur.factories}</b> 厂
          <button class="sml-btn" onclick="adjustProd('${l.k}',1)">＋</button>
        </div>
        <span style="font-size:11px;color:var(--all)">+${(cur.factories*l.out)|0}/月</span>
      </div>
      <div class="pbar"><div style="width:${pct}%"></div></div>
    </div>`;
  });
  // 建造工厂
  html+=`<div class="divider"></div>
    <h4 style="color:var(--gold);font-size:12px;margin-bottom:6px">建造新工厂（耗费民用工厂进度）</h4>
    <div class="row"><span>可用民用</span><b>${c.civ}</b></div>
    <button class="sml-btn" onclick="buildFactory('civ')">建造民用工厂（15PP+2000钢, 90天）</button>
    <button class="sml-btn" onclick="buildFactory('mil')">建造军工厂（20PP+1500钢, 100天）</button>`;
  return html;
}
function adjustProd(k,d){
  const c=G.cs[G.me];
  if(!c.prod[k])c.prod[k]={factories:0,progress:0};
  if(d>0){
    const lines=Object.values(c.prod).reduce((s,x)=>s+x.factories,0);
    if(lines>=c.mil)return;
    c.prod[k].factories++;
  } else {
    if(c.prod[k].factories<=0)return;
    c.prod[k].factories--;
  }
  renderUI();
}
function buildFactory(k){
  const c=G.cs[G.me];
  const cost={civ:{pp:15,steel:2000},mil:{pp:20,steel:1500}}[k];
  if(c.pp<cost.pp||c.steel<cost.steel)return alert('资源不足');
  c.pp-=cost.pp;c.steel-=cost.steel;c[k]++;renderUI();
}

function renderTech(){
  const c=G.cs[G.me];
  const cats={inf:'🪖 步兵',arm:'🚛 装甲',air:'🛩 空军',ind:'🏭 工业',nuk:'☢ 核武器'};
  let html='';
  for(const cat in cats){
    const list=TECHS.filter(t=>t.cat===cat);
    html+=`<h4 style="color:var(--gold);font-size:12px;margin:10px 0 6px">${cats[cat]}</h4><div class="tech-tree">`;
    list.forEach(t=>{
      const done=c.techs.includes(t.id);const res=c.researching===t.id;
      const reqOk=!t.req||t.req.every(r=>c.techs.includes(r));
      let cls='tech-node';if(done)cls+=' done';else if(res)cls+=' res';else if(!reqOk)cls+=' locked';
      html+=`<div class="${cls}" onclick="${!done&&reqOk?`startResearch('${t.id}')`:''}">
        <div class="tn">${t.name}</div>
        <div class="td">${t.desc}<br>需 ${t.time}天 / ${t.cost}PP</div>
        ${res?`<div style="margin-top:3px;height:3px;background:var(--border);border-radius:2px;overflow:hidden"><div style="width:${(c.researchProgress/t.time*100)|0}%;height:100%;background:var(--gold)"></div></div>`:''}
      </div>`;
    });
    html+='</div>';
  }
  return html;
}
function startResearch(tid){
  const c=G.cs[G.me];const t=TECHS.find(x=>x.id===tid);
  if(!t||c.techs.includes(tid)||c.researching)return;
  if(c.pp<t.cost)return alert('政治点不足');
  c.pp-=t.cost;c.researching=tid;c.researchProgress=0;renderUI();
}

function renderDiplomacy(){
  const c=G.cs[G.me];
  let html='';
  const list=[];
  for(const cc in G.cs){
    if(cc===G.me)continue;
    list.push(cc);
  }
  list.sort((a,b)=>(G.rel[G.me][b]||0)-(G.rel[G.me][a]||0));
  list.forEach(cc=>{
    const o=G.cs[cc];
    const rel=G.rel[G.me][cc]||0;
    const war=isAtWar(G.me,cc);const ally=isFriendly(G.me,cc);
    const col=rel>40?'var(--all)':rel<-40?'var(--war)':'var(--gold)';
    html+=`<div class="row" style="border-top:1px solid var(--border);padding-top:6px">
      <div style="display:flex;align-items:center;gap:6px;min-width:130px">
        <div style="width:16px;height:10px;background:${ccol(cc)};border-radius:1px"></div>
        <span>${o.flag} ${o.name}</span>
      </div><b style="color:${col}">${rel>0?'+':''}${rel}${war?' ⚔':''}</b>
    </div>`;
    html+=`<div style="padding:2px 0 8px;display:flex;gap:3px;flex-wrap:wrap">`;
    if(war){
      html+=`<button class="sml-btn danger" onclick="peace('${cc}')">和谈</button>`;
    } else {
      if(rel<-20)html+=`<button class="sml-btn danger" onclick="declareWar('${cc}')">宣战</button>`;
      else html+=`<button class="sml-btn danger" onclick="declareWar('${cc}')">宣战 (降稳定)</button>`;
      html+=`<button class="sml-btn" onclick="improve('${cc}')">改善 (20PP)</button>`;
      if(o.faction===c.faction||rel>60)html+=`<button class="sml-btn primary" onclick="ally('${cc}')">同盟</button>`;
    }
    html+=`</div>`;
  });
  return html;
}
function declareWar(cc){
  const c=G.cs[G.me];
  if(c.pp<50){alert('需要50政治点');return;}
  c.pp-=50;c.stab-=8;c.warSupport+=10;c.atWar[cc]=true;
  G.ccWars[`${G.me}-${cc}`]=true;
  newsFlash(`${cflag(G.me)} ${cname(G.me)} 向 ${cname(cc)} 宣战！`);
  renderUI();renderMap();
}
function improve(cc){
  const c=G.cs[G.me];if(c.pp<20)return alert('政治点不足');
  c.pp-=20;G.rel[G.me][cc]=clamp((G.rel[G.me][cc]||0)+15,-100,100);G.rel[cc][G.me]=G.rel[G.me][cc];
  renderUI();
}
function ally(cc){
  const c=G.cs[G.me];if(c.pp<80)return alert('需要80政治点');
  c.pp-=80;G.rel[G.me][cc]=90;G.rel[cc][G.me]=90;
  newsFlash(`与 ${cname(cc)} 签订同盟条约！`);renderUI();
}
function peace(cc){
  const c=G.cs[G.me];
  if(c.pp<100){alert('和谈需要100政治点');return;}
  c.pp-=100;c.atWar[cc]=false;
  if(G.cs[cc].atWar) G.cs[cc].atWar[G.me]=false;
  G.rel[G.me][cc]=clamp((G.rel[G.me][cc]||0)+20,-100,100);G.rel[cc][G.me]=G.rel[G.me][cc];
  newsFlash(`与 ${cname(cc)} 签订停战协议！`);renderUI();renderMap();
}

    });
    if(G.selArmy){
      const a=G.armies.find(x=>x.id===G.selArmy);
      if(a && a.cc===G.me && a.prov!==G.selProv){
        const isEnemy=isAtWar(G.me,m.cc);const isF=isFriendly(G.me,m.cc);
        if(isEnemy || isF || m.cc===G.me){
          rb.innerHTML+=`<div class="divider"></div>
            <button class="sml-btn primary" style="width:100%" onclick="moveArmyTo(${a.id},'${G.selProv}')">
              ${isEnemy?'⚔ 进攻':'→ 移防'} ${p.name}
            </button>`;
        }
      }
    }
  } else {
    const c=G.cs[G.me];
    rb.innerHTML=`<div class="row"><span>国家</span><b style="color:${ccol(G.me)}">${cflag(G.me)} ${cname(G.me)}</b></div>
      <div class="row"><span>元首</span><b>${c.leader}</b></div>
      <div class="row"><span>意识形态</span><b>${c.ideology}</b></div>
      <div class="row"><span>稳定</span><b>${fmt(c.stab)}/100</b></div>
      <div class="mini-bar"><div style="width:${clamp(c.stab,0,100)}%;background:${c.stab<40?'var(--war)':'var(--gold)'}"></div></div>
      <div class="divider"></div>
      <div class="row"><span>我控省份</span><b>${Object.values(PROVINCES).filter(p=>G.provMap[p.id].cc===G.me).length}</b></div>
      <div class="row"><span>敌对国家</span><b style="color:var(--war)">${Object.keys(G.cs).filter(x=>isAtWar(G.me,x)).length}</b></div>
      <div class="row"><span>友好国家</span><b style="color:var(--all)">${Object.keys(G.cs).filter(x=>x!==G.me&&isFriendly(G.me,x)).length}</b></div>
      <div class="divider"></div>
      <div style="color:var(--dim);font-size:11px;line-height:1.7">
        <b>操作提示：</b><br>
        • 点击省份查看详情<br>
        • 在「陆军」面板选中部队 → 点击省份移动/进攻<br>
        • 使用「外交」面板宣战或改善关系<br>
        • 使用「国策/科技」提升国力<br>
        • 底部可调整速度或暂停
      </div>`;
  }
}

// ====== 地图: region-based ======
function renderMap(){
  if(!G.selRegion) G.selRegion = 'einheitspakt';
  const regionKey = G.selRegion || 'einheitspakt';
  const raw = REGION_RAW_SVG[regionKey] || '';
  const vb = REGION_VIEWBOX[regionKey] || {x:0,y:0,w:2400,h:1080};
  const padX = vb.w * 0.02;
  const padY = vb.h * 0.02;
  const vx = vb.x - padX, vy = vb.y - padY, vw = vb.w + padX*2, vh = vb.h + padY*2;
  let sb = '<svg viewBox="'+vx+' '+vy+' '+vw+' '+vh+'" preserveAspectRatio="xMidYMid meet" id="svgMap" '
    + 'xmlns="http://www.w3.org/2000/svg" style="cursor:grab;">'
    + '<defs>'
    + '<linearGradient id="sea2" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#0b1524"/><stop offset="100%" stop-color="#060a12"/></linearGradient>'
    + '<filter id="hiF" x="-30%" y="-30%" width="160%" height="160%">'
    + '<feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#ffd76a" flood-opacity="1"/>'
    + '<feComponentTransfer><feFuncA type="linear" slope="3"/></feComponentTransfer></filter>'
    + '</defs>'
    + '<rect x="'+vb.x+'" y="'+vb.y+'" width="'+vb.w+'" height="'+vb.h+'" fill="url(#sea2)"/>'
    + raw
    + '<g id="overlayLayer"></g>'
    + '</svg>';
  $('mapSvg').innerHTML = sb;
  const svgMap=$('svgMap');
  if(!svgMap) return;
  const labelFont = Math.max(9, Math.round(vw*0.008));
  svgMap.querySelectorAll && svgMap.querySelectorAll('g[id^="prov-"]').forEach(function(g){
    const pid=g.getAttribute('data-id');
    const ccAttr=g.getAttribute('data-cc');
    const provData = PROVINCES[pid];
    if(provData && provData.region && provData.region !== regionKey) return;
    const gm = G.provMap[pid];
    let cc = (gm && G.cs[gm.cc]) ? gm.cc : ccAttr;
    if(gm && gm.controller && G.cs[gm.controller]) cc = gm.controller;
    const countries = G.countries;
    const ctry = countries ? (countries[cc] || countries[(cc||'').toUpperCase()] || countries[(cc||'').toLowerCase()] || null) : null;
    let fill='#4c5563';
    if(ctry && ctry.color) fill=ctry.color;
    let stroke='rgba(0,0,0,0.5)';
    if(ctry && ctry.color) stroke=shade(ctry.color,-18);
    g.querySelectorAll('polygon,polyline,path').forEach(function(s){
      s.setAttribute('fill', fill);
      s.setAttribute('stroke', stroke);
      s.setAttribute('stroke-width','0.45');
      s.setAttribute('stroke-linejoin','round');
    });
    g.setAttribute('data-owner-cc', cc);
    g.style.cursor='pointer';
    g.addEventListener('click', function(e){
      e.stopPropagation();
      if(typeof onMapClick==='function') onMapClick(pid);
    });
    if(provData && provData.name && provData.cx != null){
      const txt=document.createElementNS('http://www.w3.org/2000/svg','text');
      txt.setAttribute('x', provData.cx);
      txt.setAttribute('y', provData.cy - labelFont*0.6);
      txt.setAttribute('text-anchor','middle');
      txt.setAttribute('font-size', labelFont+'px');
      txt.setAttribute('fill','rgba(245,232,200,0.92)');
      txt.setAttribute('stroke','rgba(0,0,0,0.6)');
      txt.setAttribute('stroke-width','0.35');
      txt.setAttribute('font-family','system-ui,"PingFang SC","Microsoft YaHei",sans-serif');
      txt.setAttribute('pointer-events','none');
      txt.textContent = provData.name.length>10?provData.name.slice(0,10)+'…':provData.name;
      svgMap.insertBefore(txt, svgMap.querySelector('#overlayLayer'));
    }
  });
  for(const id in (G.countries||{})){
    const c = G.countries[id];
    if(!c || !c.capital || !G.provMap[c.capital]) continue;
    const p = PROVINCES[c.capital];
    if(!p || p.cx == null) continue;
    if(p.region !== regionKey) continue;
    const mk=document.createElementNS('http://www.w3.org/2000/svg','g');
    mk.setAttribute('transform','translate('+p.cx+','+p.cy+')');
    mk.setAttribute('pointer-events','none');
    const r = Math.max(3.2, vw*0.0045);
    mk.innerHTML='<circle r="'+r+'" fill="#ffd76a" stroke="#141004" stroke-width="0.8"/>'
      + '<text y="'+(r*0.45)+'" text-anchor="middle" font-size="'+(r*1.3)+'" font-weight="bold" fill="#141004">★</text>';
    if(G.sel && (id.toUpperCase()===G.sel.toUpperCase() || id.toLowerCase()===G.sel.toLowerCase())){
      mk.innerHTML += '<circle r="'+(r*2.4)+'" fill="none" stroke="#ffd76a" stroke-width="1.5" opacity="0.85"/>';
    }
    const ov = svgMap.querySelector('#overlayLayer');
    ov && ov.appendChild(mk);
  }
  for(let ai=0; ai<G.armies.length; ai++){
    const a = G.armies[ai];
    if(!a.provId || !G.provMap[a.provId]) continue;
    const p = PROVINCES[a.provId];
    if(!p || p.cx == null) continue;
    if(p.region !== regionKey) continue;
    const cc=a.owner;
    const ctry=G.countries[cc]||null;
    const c=ctry&&ctry.color? ctry.color:'#6c7a8a';
    const isSel=G.selArmy==a.id;
    const isPlayer=(G.playerCC&&(G.playerCC.toLowerCase()===cc.toLowerCase()));
    const mk=document.createElementNS('http://www.w3.org/2000/svg','g');
    const sc = Math.max(1, vw/1400);
    const off = 10*sc;
    mk.setAttribute('transform','translate('+(p.cx+off)+','+(p.cy+off)+') scale('+sc+')');
    mk.setAttribute('cursor','pointer');
    const frameFill = isPlayer?c:shade(c,-10);
    const border = isSel?'#ffd76a':'#060606';
    mk.innerHTML='<rect x="-14" y="-16" width="28" height="22" rx="3" fill="'+frameFill+'" stroke="'+border+'" stroke-width="'+(isSel?2:1)+'"/>'
      + '<text y="-1" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff8e1" font-family="monospace">'+a.divisions+'</text>'
      + '<text y="8" text-anchor="middle" font-size="8" fill="#fff8e1" font-family="monospace">'+a.id+'</text>';
    (function(armyId){
      mk.addEventListener('click',function(e){e.stopPropagation();if(typeof onArmyClick==='function')onArmyClick(armyId);});
    })(a.id);
    const ov3=svgMap.querySelector('#overlayLayer'); ov3 && ov3.appendChild(mk);
    if(a.targetProv && a.targetProv!==a.provId && PROVINCES[a.targetProv] && PROVINCES[a.targetProv].cx!=null && PROVINCES[a.targetProv].region===regionKey){
      const t=PROVINCES[a.targetProv];
      const arr=document.createElementNS('http://www.w3.org/2000/svg','path');
      const dx=t.cx-p.cx, dy=t.cy-p.cy, len=Math.max(1,Math.hypot(dx,dy));
      const ux=dx/len, uy=dy/len;
      const sx=p.cx + (off+off)*ux, sy=p.cy + (off+off)*uy;
      const ex=t.cx - off*ux*0.8, ey=t.cy - off*uy*0.8;
      arr.setAttribute('d','M'+sx+','+sy+' L'+ex+','+ey);
      arr.setAttribute('stroke', isPlayer?'#ffd76a':'#ffffffaa');
      arr.setAttribute('stroke-width', String(isPlayer?(2*sc):(1.5*sc)));
      arr.setAttribute('stroke-dasharray', (6*sc)+' '+(4*sc));
      arr.setAttribute('fill','none');
      arr.setAttribute('pointer-events','none');
      const ov2=svgMap.querySelector('#overlayLayer'); ov2 && ov2.appendChild(arr);
    }
  }
  if(G.selProv){
    const selG = svgMap.querySelector('#prov-'+G.selProv);
    if(selG){
      selG.querySelectorAll('polygon,polyline,path').forEach(function(s){
        s.setAttribute('stroke','#ffd76a');
        s.setAttribute('stroke-width', String(2.4*Math.max(1,vw/1600)));
      });
      selG.setAttribute('filter','url(#hiF)');
    }
  }
  attachPanZoom();
}
function brighten(hex,f){
  const h=hex.replace('#','');if(h.length<6)return hex;
  let r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  r=clamp(Math.round(r*f),0,255);g=clamp(Math.round(g*f),0,255);b=clamp(Math.round(b*f),0,255);
  return `#${[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('')}`;
}
let PAN=null;
function attachPanZoom(){
  const area=$('mapArea'), svg=$('svgMap');if(!svg)return;
  if(PAN===null){
    area.dataset.sx=0;area.dataset.sy=0;area.dataset.z=1;
  }
  let drag=false,lx=0,ly=0;

  // === 鼠标事件（桌面端） ===
  svg.onmousedown=(e)=>{if(e.target.closest('g[id^=prov-], .army-marker'))return;drag=true;lx=e.clientX;ly=e.clientY;area.style.cursor='grabbing';};
  window.addEventListener('mouseup',()=>{drag=false;area.style.cursor='';});
  area.onmousemove=(e)=>{
    if(!drag)return;
    const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
    area.dataset.sx=((+area.dataset.sx)||0)+dx;
    area.dataset.sy=((+area.dataset.sy)||0)+dy;
    updateTransform();
  };
  area.onwheel=(e)=>{
    e.preventDefault();
    let z=+area.dataset.z;
    const nz=clamp(z*(e.deltaY<0?1.1:0.9),0.6,4);
    area.dataset.z=nz;
    updateTransform();
  };

  // === 触摸事件（手机端） ===
  let touchDragging=false, touchPinching=false;
  let lastTouchX=0, lastTouchY=0;
  let lastPinchDist=0;
  let touchMoved=false;

  area.addEventListener('touchstart',(e)=>{
    if(e.touches.length===1){
      // 单指：拖拽地图
      touchDragging=true;touchPinching=false;
      lastTouchX=e.touches[0].clientX;
      lastTouchY=e.touches[0].clientY;
      touchMoved=false;
    } else if(e.touches.length===2){
      // 双指：缩放
      touchPinching=true;touchDragging=false;
      const dx=e.touches[0].clientX-e.touches[1].clientX;
      const dy=e.touches[0].clientY-e.touches[1].clientY;
      lastPinchDist=Math.hypot(dx,dy);
      e.preventDefault();
    }
  },{passive:false});

  area.addEventListener('touchmove',(e)=>{
    if(touchPinching && e.touches.length===2){
      e.preventDefault();
      const dx=e.touches[0].clientX-e.touches[1].clientX;
      const dy=e.touches[0].clientY-e.touches[1].clientY;
      const dist=Math.hypot(dx,dy);
      if(lastPinchDist>0){
        let z=+area.dataset.z||1;
        z=clamp(z*(dist/lastPinchDist),0.6,4);
        area.dataset.z=z;
        updateTransform();
      }
      lastPinchDist=dist;
    } else if(touchDragging && e.touches.length===1){
      const dx=e.touches[0].clientX-lastTouchX;
      const dy=e.touches[0].clientY-lastTouchY;
      if(Math.abs(dx)>3||Math.abs(dy)>3)touchMoved=true; // 标记为拖拽而非点击
      lastTouchX=e.touches[0].clientX;
      lastTouchY=e.touches[0].clientY;
      area.dataset.sx=((+area.dataset.sx)||0)+dx;
      area.dataset.sy=((+area.dataset.sy)||0)+dy;
      updateTransform();
      e.preventDefault();
    }
  },{passive:false});

  area.addEventListener('touchend',(e)=>{
    if(!touchMoved && !touchPinching){
      // 没有拖拽，保持点击行为（省份/军队的onclick会处理）
      // 关闭可能打开的右侧信息栏
      if(window.innerWidth<=640) closeRightbar();
    }
    touchDragging=false;touchPinching=false;touchMoved=false;
  },{passive:true});

  function updateTransform(){
    const sx=area.dataset.sx||0,sy=area.dataset.sy||0,z=area.dataset.z||1;
    svg.style.transform=`translate(${sx}px, ${sy}px) scale(${z})`;
    svg.style.transformOrigin='0 0';
  }
}
function onMapClick(pid){
  // 如果有选中军队，尝试移动/进攻
  if(G.selArmy){
    const a=G.armies.find(x=>x.id===G.selArmy);
    if(a && a.cc===G.me){
      moveArmyTo(a.id,pid);
      return;
    }
  }
  G.selProv=pid;
  // 手机端自动弹出右侧信息面板
  if(window.innerWidth<=640){$('rightbar').classList.add('show');}
  renderMap();renderUI();
}
function onArmyClick(aid){
  const a=G.armies.find(x=>x.id===aid);if(!a)return;
  G.selProv=a.prov;
  if(a.cc===G.me){G.selArmy=aid;newsFlash(`选中 ${a.name}，点击省份下达移动/进攻命令`);}
  // 手机端弹出右侧信息面板
  if(window.innerWidth<=640){$('rightbar').classList.add('show');}
  renderMap();renderUI();
}
function moveArmyTo(aid,pid){
  const a=G.armies.find(x=>x.id===aid);if(!a)return;
  if(a.moving)return alert('部队已在移动中');
  const from=PROVINCES[a.prov];const to=PROVINCES[pid];
  if(!from||!to)return;
  const dist=Math.hypot(from.cx-to.cx,from.cy-to.cy);
  const days=Math.max(1,Math.round(dist/a.speed*2));
  const tcc=G.provMap[pid].cc;
  if(!isAtWar(a.cc,tcc) && !isFriendly(a.cc,tcc) && tcc!==a.cc){
    return alert(`与 ${cname(tcc)} 处于中立，请先宣战`);
  }
  a.moving={target:pid, daysLeft:days, from:a.prov};
  newsFlash(`${a.name} → ${to.name}（约 ${days} 天）`);
  renderMap();renderUI();
}
function newsFlash(txt){
  // 简易新闻提示
  const el=document.createElement('div');
  el.textContent=txt;
  Object.assign(el.style,{
    position:'fixed',top:'68px',left:'50%',transform:'translateX(-50%)',
    background:'rgba(20,24,34,.95)',border:'1px solid var(--gold)',padding:'8px 18px',
    borderRadius:'4px',fontSize:'12px',color:'var(--txt)',zIndex:800,
    boxShadow:'0 6px 24px rgba(0,0,0,.5)',letterSpacing:'1px'
  });
  document.body.appendChild(el);
  setTimeout(()=>{el.style.transition='opacity .6s';el.style.opacity='0';},2400);
  setTimeout(()=>el.remove(),3200);
}

// ====== 事件弹窗 ======
let modalClose=null;
function showModal(cc,title,body,choices){
  const m=$('modal');
  $('mColor').style.background=ccol(cc);
  $('mTitle').textContent=title;
  $('mBody').innerHTML=`<p>${body.split('\n').join('</p><p>')}</p>`;
  const mch=$('mChoices');mch.innerHTML='';
  choices.forEach(c=>{
    const b=document.createElement('button');
    b.className='mc-btn';
    b.innerHTML=`<div class="mt">${typeof c.t==='function'?c.t():c.t}</div>${c.effect?`<div class="me">${c.effect}</div>`:''}`;
    b.onclick=()=>{if(c.e)c.e(G.cs[G.me]);closeModal();renderUI();};
    mch.appendChild(b);
  });
  m.style.display='flex';
}
function closeModal(){$('modal').style.display='none';}

// ====== 显示国家信息 ======
function showCountry(cc){
  const c=G.cs[cc];const war=isAtWar(G.me,cc);
  const frac=c.faction?FACTIONS[c.faction]:null;
  showModal(cc,
    `${c.flag} ${c.name} (${c.tag})`,
    `国家元首：${c.leader}\n意识形态：${c.ideology}\n${frac?`阵营：${frac.name}\n`:''}稳定度：${fmt(c.stab)}/100\n军队规模：${c.armySize} 个师\n核弹：${c.nukes} 枚\n与我国关系：${G.rel[G.me][cc]||0}${war?' 【战争状态】':''}`,
    [
      war?{t:'和谈 (100 PP)',e:()=>peace(cc)}:{t:`对其宣战 (50 PP)`,e:()=>declareWar(cc)},
      {t:'改善关系 (20 PP)',e:()=>improve(cc)},
      {t:'切换到地图视角',e:()=>{}},
    ]);
}

// ====== 游戏结束 ======
function endGame(kind,desc){
  G.gameOver=true;
  const titles={victory:['伟大胜利','你的新秩序成为了这个时代的主宰。','#45b880'],
    collapse:['国家崩溃','秩序的最后一根梁柱倒塌。','#e04545'],
    quit:['放弃','你选择了退出历史舞台。','#808794']};
  const t=titles[kind]||titles.quit;
  const c=G.cs[G.me];
  const d=new Date(1962,0,1);d.setDate(d.getDate()+G.day);
  $('endYear').textContent=`${d.getFullYear()} · ${kind==='victory'?'胜局':kind==='collapse'?'败局':'结局'}`;
  $('endTitle').textContent=t[0];$('endTitle').style.color=t[2];
  $('endDesc').textContent=t[1]+' '+desc;
  const myProv=Object.values(PROVINCES).filter(p=>G.provMap[p.id].cc===G.me).length;
  $('endStats').innerHTML=`
    <div class="es"><div class="esl">控制省份</div><div class="esv">${myProv}</div></div>
    <div class="es"><div class="esl">陆军师</div><div class="esv">${G.armies.filter(a=>a.cc===G.me).reduce((s,a)=>s+a.divisions,0)}</div></div>
    <div class="es"><div class="esl">核弹</div><div class="esv">${c.nukes}</div></div>
    <div class="es"><div class="esl">稳定度</div><div class="esv">${fmt(c.stab)}</div></div>
    <div class="es"><div class="esl">政治点</div><div class="esv">${fmt(c.pp)}</div></div>`;
  $('endScreen').style.display='flex';
}

// ====== 启动 ======
initStart();

// ===== Region selector event binding (deferred to DOM ready) =====
function _bindRegionToolbar(){
  const sel = document.getElementById('regionSelect');
  if(sel && !sel.dataset.bound){
    sel.dataset.bound='1';
    sel.addEventListener('change', (ev)=>{
      if(!window.G) return;
      window.G.selRegion = ev.target.value;
      renderMap();
    });
  }
  const zin = document.getElementById('btnRegionZoomIn');
  const zout = document.getElementById('btnRegionZoomOut');
  const area = document.getElementById('mapArea');
  if(zin && !zin.dataset.bound){
    zin.dataset.bound='1';
    zin.addEventListener('click',()=>{ if(!area) return; let z = Math.max(0.4, (+area.dataset.z||1) * 0.85); area.dataset.z = z; updateTransform(); });
  }
  if(zout && !zout.dataset.bound){
    zout.dataset.bound='1';
    zout.addEventListener('click',()=>{ if(!area) return; let z = Math.min(5, (+area.dataset.z||1) * 1.18); area.dataset.z = z; updateTransform(); });
  }
  const btnClose = document.getElementById('btnCloseMapOverlay');
  if(btnClose && !btnClose.dataset.bound){
    btnClose.dataset.bound='1';
    btnClose.addEventListener('click', ()=>{
      // If map overlay is visible (hide map-overlay-page, hide itself else just scroll page
      const ovl = document.getElementById('map-overlay-page');
      if(ovl) ovl.classList.remove('active');
    });
  }
  const lbl = document.getElementById('mapTurnLabel');
  if(lbl && window.G){
    lbl.textContent = formatTurnLabel();
  }
}
// Patch initUI hook into existing periodic check:
if(typeof window !== 'undefined'){
  const _origRenderMap = window.renderMap;
  window.renderMap = function(){
    const ret = _origRenderMap ? _origRenderMap.apply(this,arguments) : undefined;
    setTimeout(_bindRegionToolbar, 0);
    return ret;
  };
}
